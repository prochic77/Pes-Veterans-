<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PES Veterans League</title>
<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #020817, #123b70);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 45px 15px;
  background: #06142c;
  border-bottom: 4px solid #d71920;
}
h1 {
  font-size: 42px;
  color: #e6edf7;
}
h1 span { color: #ed3038; }
nav {
  padding: 20px;
  background: #132b4d;
}
button {
  background: linear-gradient(#dce7f5, #748ba8);
  border: 1px solid white;
  border-radius: 5px;
  padding: 14px;
  margin: 5px;
  cursor: pointer;
  font-weight: bold;
}
.card {
  background: #10274b;
  margin: 20px auto;
  padding: 25px;
  border: 1px solid #779bc8;
  border-radius: 12px;
  max-width: 700px;
}
</style>
</head>
<body>
<header>
<h1>PES <span>VETERANS</span> LEAGUE</h1>
<p>OLD SCHOOL PES • PLAY FOOTBALL FOREVER</p>
</header>
<nav>
<button>HLAVNÍ LIGA</button>
<button>TURNAJE</button>
<button>2 VS 2</button>
<button>STATISTIKY</button>
<button>REGISTRACE</button>
</nav>
<div class="card">
<h2>🏆 DREAM TEAM LIGA</h2>
<p>Hlavní soutěž veteránů</p>
</div>
<div class="card">
<h2>⚽ RYCHLÉ TURNAJE</h2>
<p>Reálné týmy a pohárové soutěže</p>
</div>
<div class="card">
<h2>🎮 2 VS 2</h2>
<p>Společné zápasy a statistiky dvojic</p>
</div>
<div class="card">
<h2>🎵 RADIO 90s</h2>
<p>Hudební rádio devadesátých let – připravujeme</p>
</div>
</body>
</html>PES Veterans League
